name: macs40123
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Collection, tabular processing, and columnar storage
  - pandas=3.0.6
  - requests=2.34.2
  - pyarrow=25.0.0
  - tqdm=4.70.1
  - python-dotenv=1.2.3
  # Numerical analysis, text classification, and statistical modeling
  - numpy=2.5.3
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  # Document embeddings. PyTorch must come from conda-forge, not pip: the pip
  # wheel bundles its own OpenMP runtime and crashes on import alongside
  # conda-forge's llvm-openmp. transformers is held at 4.57.x because
  # adapters 1.3.0 (needed for the SPECTER2 proximity adapter) requires
  # transformers~=4.57.6; sentence-transformers 5.7 supports that line.
  - pytorch=2.14.1
  - transformers=4.57.6
  - sentence-transformers=5.7.0
  - huggingface_hub=0.36.0
  # Citation networks and Leiden community detection
  - networkx=3.7
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  # Exploration and visualization
  - jupyter=1.1.1
  - jupyterlab=4.6.4
  - ipykernel=7.4.0
  - matplotlib=3.11.2
  - seaborn=0.13.2
  # adapters is not packaged on conda-forge
  - pip=26.2.1
  - pip:
      - adapters==1.3.0
