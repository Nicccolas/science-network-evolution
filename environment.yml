name: macs40123
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Collection, tabular processing, and columnar storage
  - pandas=3.0.6
  - requests=2.34.2
  - pyarrow=25.0.0
  - tqdm=4.70.1
  - python-dotenv=1.2.3
  # Numerical analysis, text classification, and statistical modeling
  - numpy=2.5.3
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  - sentence-transformers=2.3.0
  # Citation networks and Leiden community detection
  - networkx=3.7
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  # Exploration and visualization
  - jupyter=1.1.1
  - jupyterlab=4.6.4
  - ipykernel=7.4.0
  - matplotlib=3.11.2
  - seaborn=0.13.2
